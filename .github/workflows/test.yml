name: EZ Construction estimator checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic offline estimator tests
        run: node tests/estimator.test.js
